<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>브레인 사운드 기기 QR 라벨</title>
<script src="qrcode.min.js"></script>
<style>
  :root { --bg:#03050f; --card:#0f1631; --ink:#fff; --muted:#9aa4c2; --line:#1e2848; --main:#3b4fe0; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:"Pretendard","Malgun Gothic",system-ui,sans-serif; padding:24px; }
  h1 { font-size:22px; margin:0 0 6px; } .sub { color:var(--muted); font-size:14px; margin:0 0 18px; line-height:1.7; }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px; max-width:760px; display:grid; gap:14px; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); align-items:end; }
  label { display:grid; gap:6px; font-size:13px; font-weight:600; }
  input, select { font:inherit; padding:10px 12px; border-radius:10px; border:1px solid #2a3558; background:var(--bg); color:var(--ink); width:100%; }
  .btn { font:inherit; font-weight:700; padding:11px 18px; border-radius:999px; border:0; background:linear-gradient(135deg,#4a5cff,#6a3bff); color:#fff; cursor:pointer; }
  .btn.ghost { background:none; border:1px solid #3a4666; }
  .actions { display:flex; gap:10px; flex-wrap:wrap; margin:16px 0; }
  .note { font-size:12.5px; color:var(--muted); line-height:1.7; max-width:760px; }
  #sheet { display:flex; flex-wrap:wrap; gap:10px; margin-top:8px; }
  .label { background:#fff; color:#000; border-radius:6px; padding:8px; display:flex; gap:8px; align-items:center; border:1px dashed #999; }
  .label .t { font-size:10px; line-height:1.35; } .label .t b { display:block; font-size:12px; }
  .label .code { font-family:Consolas,monospace; font-size:11px; font-weight:700; letter-spacing:.02em; }
  @media print {
    body { background:#fff; padding:0; } h1,.sub,.panel,.actions,.note,#warn { display:none !important; }
    #sheet { gap:0; margin:0; } .label { border:1px dashed #bbb; border-radius:0; break-inside:avoid; }
  }
</style>
</head>
<body>
<h1>기기 QR 라벨 만들기</h1>
<p class="sub">기기마다 고유 코드를 만들고, 붙일 QR 스티커를 인쇄합니다. 이 코드를 PC 버전의 <b>설정 → 기기 등록</b>에 입력하거나 스캔하면 기기가 등록됩니다.</p>
<div class="panel">
  <label>모델<select id="model"><option value="BSM">브레인 메이커스 (DIY 키트)</option><option value="BSB">브레인 밴드 (완성품)</option></select></label>
  <label>연결<select id="conn"><option value="U">유선 버전</option><option value="W">무선 버전</option></select></label>
  <label>시작 번호<input type="number" id="start" value="1" min="1" max="999999"></label>
  <label>개수<input type="number" id="count" value="12" min="1" max="200"></label>
  <label>QR 크기(px)<input type="number" id="size" value="84" min="48" max="200"></label>
  <label>QR에 넣을 주소 (선택)<input id="base" placeholder="비워 두면 코드만 들어갑니다"></label>
</div>
<div class="actions"><button class="btn" id="make">라벨 만들기</button><button class="btn ghost" id="print">인쇄</button><button class="btn ghost" id="csv">코드 목록 CSV</button></div>
<p class="note" id="warn">※ QR 만드는 부품을 인터넷에서 불러오므로 이 화면은 인터넷이 연결되어 있어야 합니다. 같은 번호를 두 번 인쇄하지 않도록, 인쇄한 번호 범위는 따로 기록해 두세요. 주소를 넣으면 QR에 <code>주소?c=코드</code> 형태로 들어가며, 그 주소의 페이지는 아직 없습니다(스마트폰 앱 또는 웹페이지가 생긴 뒤에 사용).</p>
<div id="sheet"></div>
<script>
const $ = id => document.getElementById(id);
const MODEL = { BSM: '브레인 메이커스', BSB: '브레인 밴드' }, CONN = { U: '유선', W: '무선' };
// 확인 문자: PC 버전의 기기 등록과 같은 규칙입니다. 바꾸면 등록이 안 됩니다.
function check(body) { let h = 7; for (const c of body) h = (h * 31 + c.charCodeAt(0)) % 1296; return h.toString(36).toUpperCase().padStart(2, '0'); }
function codeOf(model, conn, n) { const body = model + conn + String(n).padStart(6, '0'); return `${model}-${conn}-${String(n).padStart(6, '0')}-${check(body)}`; }
let codes = [];
function make() {
  if (typeof QRCode === 'undefined') { alert('QR 부품을 불러오지 못했어요. 인터넷 연결을 확인해 주세요.'); return; }
  const model = $('model').value, conn = $('conn').value, start = Math.max(1, +$('start').value || 1), count = Math.min(200, Math.max(1, +$('count').value || 1)), size = Math.max(48, +$('size').value || 84), base = $('base').value.trim();
  const sheet = $('sheet'); sheet.innerHTML = ''; codes = [];
  for (let i = 0; i < count; i++) {
    const code = codeOf(model, conn, start + i); codes.push(code);
    const el = document.createElement('div'); el.className = 'label'; const q = document.createElement('div');
    el.appendChild(q); const t = document.createElement('div'); t.className = 't'; t.innerHTML = `<b>BRAIN SOUND</b>${MODEL[model]} ${CONN[conn]} 버전<div class="code">${code}</div>`; el.appendChild(t); sheet.appendChild(el);
    new QRCode(q, { text: base ? `${base}${base.includes('?') ? '&' : '?'}c=${code}` : code, width: size, height: size, correctLevel: QRCode.CorrectLevel.M });
  }
}
$('make').onclick = make; $('print').onclick = () => { if (!codes.length) make(); setTimeout(() => window.print(), 300); };
$('csv').onclick = () => { if (!codes.length) make(); const a = document.createElement('a'); a.download = '기기코드목록.csv'; a.href = URL.createObjectURL(new Blob(['﻿코드,모델,연결\n' + codes.map(c => `${c},${MODEL[c.slice(0, 3)]},${CONN[c[4]]}`).join('\n')], { type: 'text/csv' })); a.click(); };
make();
</script>
</body>
</html>
