<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>브레인 사운드 본사 관리자</title>
<style>
  :root { --bg:#04050d; --muted:#9aa4c2; --line:#1e2848; --main:#3b4fe0; --glow:#8f9bff; --ok:#4ade80; --warn:#ff8a57; --gold:#ffd86b; --cyan:#5ee7ff; --bad:#ff6b6b; }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { margin:0; background:radial-gradient(1100px 460px at 50% -10%,#1a2470 0,#04050d 62%) no-repeat, var(--bg); color:#fff; font-family:"Pretendard Variable","Pretendard","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif; word-break:keep-all; min-height:100vh; }
  button,input,select { font:inherit; color:inherit; }
  button { cursor:pointer; }
  .wrap { max-width:980px; margin:0 auto; padding:24px 20px 70px; }
  .logo { font-weight:900; letter-spacing:.16em; font-size:14px; background:linear-gradient(90deg,#fff,var(--glow)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  h1 { font-size:clamp(26px,5vw,38px); margin:8px 0 6px; } h2 { font-size:19px; margin:0 0 4px; } h3 { font-size:15px; margin:0 0 8px; }
  .sub { color:var(--muted); font-size:14.5px; line-height:1.7; margin:0 0 18px; }
  .hint { font-size:13px; color:var(--muted); line-height:1.65; }
  .warnbox { background:rgba(255,138,87,.1); border:1px solid rgba(255,138,87,.4); border-radius:12px; padding:11px 15px; font-size:13.5px; color:#ffd2bd; margin-bottom:16px; line-height:1.65; }
  .steps { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin:6px 0 18px; }
  @media (max-width:760px) { .steps { grid-template-columns:1fr 1fr; } }
  .st { text-align:left; padding:13px 14px; border-radius:14px; border:1px solid rgba(143,155,255,.2); background:rgba(255,255,255,.03); }
  .st:hover { border-color:var(--glow); }
  .st.on { border-color:var(--cyan); background:rgba(94,231,255,.08); box-shadow:0 0 0 1px var(--cyan) inset; }
  .st i { font-style:normal; display:inline-flex; width:24px; height:24px; border-radius:50%; background:linear-gradient(135deg,#4a5cff,#8f6bff); align-items:center; justify-content:center; font-size:12.5px; font-weight:800; margin-right:8px; }
  .st b { font-size:14.5px; } .st span { display:block; font-size:12px; color:var(--muted); margin-top:4px; }
  .card { background:linear-gradient(145deg,rgba(255,255,255,.07),rgba(255,255,255,.015)); border:1px solid rgba(143,155,255,.2); border-radius:20px; padding:22px; margin-bottom:16px; }
  .form { display:grid; grid-template-columns:1fr 1fr; gap:14px 16px; }
  @media (max-width:700px) { .form { grid-template-columns:1fr; } }
  .full { grid-column:1/-1; }
  label.f { display:grid; gap:6px; font-size:13.5px; font-weight:700; }
  label.f small { font-weight:400; color:var(--muted); font-size:12px; }
  input[type=text],input[type=email],input[type=number],select { padding:12px 14px; border-radius:12px; border:1px solid #2a3558; background:#070a1c; width:100%; font-size:15px; }
  input:focus,select:focus { outline:2px solid var(--cyan); outline-offset:0; border-color:transparent; }
  .chk { display:flex; gap:10px; align-items:flex-start; font-size:13.5px; line-height:1.6; color:#cfd6f5; } .chk input { margin-top:4px; width:17px; height:17px; flex:none; }
  .btn { border:1px solid #2a3558; background:rgba(255,255,255,.05); padding:11px 22px; border-radius:999px; font-size:14.5px; font-weight:700; }
  .btn:hover { border-color:var(--glow); }
  .btn.pri { background:linear-gradient(135deg,#4a5cff,#3b4fe0 60%,#6a3bff); border:0; box-shadow:0 8px 26px rgba(74,92,255,.5); }
  .btn.sm { padding:6px 13px; font-size:12.5px; }
  .row { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  .msg { font-size:13.5px; line-height:1.6; } .msg.bad { color:var(--bad); } .msg.ok { color:var(--ok); }
  .codebox { margin-top:14px; padding:16px 18px; border-radius:14px; background:rgba(94,231,255,.08); border:1px dashed var(--cyan); }
  .codebox .code { font-size:30px; font-weight:900; letter-spacing:.14em; color:var(--cyan); font-variant-numeric:tabular-nums; }
  table { width:100%; border-collapse:collapse; font-size:14px; } td,th { text-align:left; padding:10px 8px; border-bottom:1px solid var(--line); vertical-align:middle; } th { color:var(--muted); font-weight:600; font-size:12.5px; }
  .tag { display:inline-block; font-size:12px; padding:3px 10px; border-radius:999px; border:1px solid #2a3556; color:var(--muted); }
  .tag.ok { color:#c8f7d9; border-color:rgba(74,222,128,.5); } .tag.wait { color:#ffd2bd; border-color:rgba(255,138,87,.5); }
  .mono { font-family:Consolas,monospace; letter-spacing:.08em; color:var(--cyan); font-weight:700; }
  .empty { color:var(--muted); font-size:14px; padding:18px 6px; text-align:center; }
  footer { margin-top:30px; font-size:12.5px; color:#6b7599; line-height:1.8; }
  .wrap { max-width:1100px; }
  .tabs { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; } .tabs .btn.on { border-color:var(--cyan); background:rgba(94,231,255,.1); }
  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-bottom:16px; }
  .stats button { text-align:left; padding:14px 16px; border-radius:14px; border:1px solid rgba(143,155,255,.2); background:rgba(255,255,255,.03); }
  .stats span { display:block; font-size:12.5px; color:var(--muted); } .stats b { font-size:26px; }
  .link { background:none; border:0; padding:0; text-decoration:underline; text-underline-offset:3px; color:var(--cyan); font-size:inherit; }
  .scroll { overflow-x:auto; } td { white-space:nowrap; }
  .search { padding:10px 14px; border-radius:12px; border:1px solid #2a3558; background:#070a1c; min-width:220px; }
</style>
</head>
<body>
<div class="wrap">
  <a class="logo" href="landing.html" target="_top" aria-label="브레인 사운드 첫 화면" style="text-decoration:none">BRAIN SOUND</a>
  <h1>본사 관리자</h1>
  <p class="sub">훈련장·트레이너·교사 승인, 학교·반·학생(회원) 관리, 대회·훈련 기록 확인을 한곳에서 합니다.</p>
  <form class="card" id="login" style="max-width:460px">
    <label class="f">관리자 비밀번호<input type="password" id="pw" autocomplete="current-password" class="search"></label>
    <div class="row" style="margin-top:16px"><button class="btn pri" id="inBtn">들어가기</button><span class="msg" id="inMsg"></span></div>
  </form>
  <div id="main" hidden>
    <div class="stats" id="stats"></div>
    <div class="tabs" id="tabs"></div>
    <div class="row" style="margin-bottom:14px"><input class="search" id="q" placeholder="이름·닉네임·학교·코드 검색" aria-label="검색"><span class="tag" id="filter" hidden></span><button class="btn sm" id="clear" hidden>선택 해제</button><span style="flex:1"></span><button class="btn sm" id="re">새로고침</button><button class="btn sm" id="pwOpen">비밀번호 변경</button><button class="btn sm" id="out">나가기</button></div>
    <form class="card" id="pwForm" style="max-width:460px" hidden><h3>비밀번호 변경</h3>
      <div class="form" style="grid-template-columns:1fr"><label class="f">지금 비밀번호<input type="password" id="pwOld" autocomplete="current-password" class="search"></label>
      <label class="f">새 비밀번호 (8자 이상)<input type="password" id="pwNew" autocomplete="new-password" class="search"></label>
      <label class="f">새 비밀번호 다시 입력<input type="password" id="pwNew2" autocomplete="new-password" class="search"></label></div>
      <div class="row" style="margin-top:16px"><button class="btn pri" id="pwSave">변경하기</button><button type="button" class="btn" id="pwCancel">닫기</button><span class="msg" id="pwMsg"></span></div>
    </form>
    <div class="row" style="margin-bottom:10px"><span class="msg" id="msg"></span></div>
    <div class="card"><div class="scroll" id="list"></div></div>
    <div class="card" id="detail" hidden></div>
    <div class="card"><h3>대회 설정</h3><label class="chk"><input type="checkbox" id="demoOk"><span><b>시험용: 데모 모드 점수도 대회 순위에 올리기.</b> 실제 대회에서는 반드시 꺼 두세요.</span></label><span class="msg" id="setMsg"></span>
      <label class="chk" style="margin-top:14px"><input type="checkbox" id="admTest"><span><b>이 컴퓨터를 관리자 테스트용으로 사용.</b> 이 브라우저의 PC 앱 데모 모드에서만 <b>스페이스를 집중력</b>으로 쓰고 방향키로 움직일 수 있어요. 다른 사람의 컴퓨터에는 영향이 없어요. 시험이 끝나면 끄세요.</span></label></div>
    <div class="card"><div class="row" style="justify-content:space-between"><h3 id="iqTitle">홈페이지 문의</h3></div><div class="scroll" id="inquiries"></div></div>
  </div>
</div>
<script>
// 서버(Supabase). 공개용 키만 사용하고, 테이블에는 직접 접근하지 않고 bs_ 함수만 호출한다.
const BS_URL = 'https://brfeszcyjsaprbakqsjl.supabase.co', BS_KEY = 'sb_publishable_0Nsga8WVTqBcBS6kcUytrg_UB-1FtnK';
async function bsRpc(fn, args) { const r = await fetch(BS_URL + '/rest/v1/rpc/' + fn, { method: 'POST', headers: { apikey: BS_KEY, 'Content-Type': 'application/json' }, body: JSON.stringify(args || {}), signal: AbortSignal.timeout(10000) }); if (!r.ok) throw new Error('server ' + r.status); return r.json(); }
const bsGet = k => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } };
const $ = id => document.getElementById(id);
const esc = t => String(t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const say = (id, t, k) => { const e = $(id); e.textContent = t; e.className = 'msg ' + (k || ''); };
const GN = { balloon: '방울 개구리', car: '자동차 경주', puzzle: '보석 블록', dragon: '별빛 편대', candle: '숨결 촛불', flower: '꽃길 산책', axe: '번개 창던지기', archery: '바람 양궁', balance: '외줄타기', tug: '번개 100미터' };
const KINDS = { centers: ['훈련장', 'center'], trainers: ['트레이너', 'trainer'], teachers: ['교사', 'teacher'], students: ['학생 회원', 'student'], classes: ['반', 'class'], schools: ['학교', 'school'] };
const when = t => t ? new Date(t).toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '-';
let pw = '', D = null, tab = 'centers', only = null, shown = null;   // 비밀번호는 저장하지 않음. only: { key, id, label }
const NET = '처리하지 못했어요. 인터넷 연결과 3번(관리자) SQL 실행 여부를 확인해 주세요.';
const by = (k, id) => D[k].find(x => x.id === id) || {};
// 각 항목이 어느 학교·교사·반에 속하는지
function ties(k, x) {
  if (k === 'schools') return { school_id: x.id };
  if (k === 'centers') return { center_id: x.id };
  if (k === 'trainers') return { trainer_id: x.id, center_id: x.center_id };
  if (k === 'teachers') return { school_id: x.school_id, teacher_id: x.id };
  if (k === 'classes') return { school_id: x.school_id, teacher_id: x.teacher_id, trainer_id: x.trainer_id, center_id: by('trainers', x.trainer_id).center_id, class_id: x.id };
  const c = by('classes', x.class_id); return { school_id: c.school_id, teacher_id: c.teacher_id, trainer_id: c.trainer_id, center_id: by('trainers', c.trainer_id).center_id, class_id: x.class_id };
}
const go = (t, key, id, label, text) => `<button class="link" data-go="${t}" data-key="${key}" data-id="${esc(id)}" data-label="${esc(label)}">${esc(text)}</button>`;
const del = (k, id) => `<button class="btn sm" data-del="${KINDS[k][1]}" data-id="${esc(id)}">삭제</button>`;
const stag = s => s === '승인' ? '<span class="tag ok">승인됨</span>' : s === '거절' ? '<span class="tag wait">거절됨</span>' : '<span class="tag wait">승인 대기</span>';
const trLink = id => go('trainers', 'trainer_id', id, (by('trainers', id).name || '?') + ' 트레이너', (by('trainers', id).name || '?') + ' 트레이너');
const COLS = {
  centers: [['훈련장', '담당자', '트레이너', '아이', '상태', '처리'], c => { const n = k => D[k].filter(x => ties(k, x).center_id === c.id).length;
    return [`<b>${esc(c.name)}</b><br><span class="hint">${esc(c.region)}${c.address ? ' · ' + esc(c.address) : ''}</span>`, `${esc(c.manager)}<br><span class="hint">${esc(c.phone)} · ${esc(c.email)}</span>`,
      go('trainers', 'center_id', c.id, c.name, n('trainers') + '명'), go('students', 'center_id', c.id, c.name, n('students') + '명'), stag(c.status),
      (c.status !== '승인' ? `<button class="btn sm pri" data-ce="${esc(c.id)}" data-s="승인">승인</button> ` : '') + (c.status !== '거절' ? `<button class="btn sm" data-ce="${esc(c.id)}" data-s="거절">${c.status === '승인' ? '승인 취소' : '거절'}</button> ` : '') + `<button class="btn sm" data-cepw="${esc(c.id)}">비밀번호 재설정</button>`]; }],
  trainers: [['트레이너', '연락처', '지역', '소속 훈련장', '반', '회원', '상태', '처리'], t => [`<b>${esc(t.name)}</b><br><span class="hint">${esc(t.email)}</span>${t.intro ? `<br><span class="hint">${esc(t.intro)}</span>` : ''}`, esc(t.phone), esc(t.region),
    `<select class="search" style="min-width:150px" data-assign="${esc(t.id)}" aria-label="소속 훈련장"><option value="">본사 직속</option>${D.centers.map(c => `<option value="${esc(c.id)}"${c.id === t.center_id ? ' selected' : ''}>${esc(c.name)}</option>`).join('')}</select>`,
    go('classes', 'trainer_id', t.id, t.name + ' 트레이너', D.classes.filter(c => c.trainer_id === t.id).length + '개'), go('students', 'trainer_id', t.id, t.name + ' 트레이너', D.students.filter(s => ties('students', s).trainer_id === t.id).length + '명'), stag(t.status),
    (t.status !== '승인' ? `<button class="btn sm pri" data-tr="${esc(t.id)}" data-s="승인">승인</button> ` : '') + (t.status !== '거절' ? `<button class="btn sm" data-tr="${esc(t.id)}" data-s="거절">${t.status === '승인' ? '승인 취소' : '거절'}</button> ` : '') + `<button class="btn sm" data-trpw="${esc(t.id)}">비밀번호 재설정</button>`]],
  schools: [['학교', '학교 코드', '교사', '반', '학생'], s => { const n = k => D[k].filter(x => ties(k, x).school_id === s.id).length;
    return [`<b>${esc(s.name)}</b><br><span class="hint">${esc(s.region)} · ${esc(s.level)}</span>`, `<span class="mono">${esc(s.code)}</span>`, ...['teachers', 'classes', 'students'].map(k => go(k, 'school_id', s.id, s.name, n(k) + (k === 'classes' ? '개' : '명')))]; }],
  teachers: [['교사', '학교', '분야', '반', '상태', '승인'], t => [`<b>${esc(t.name)}</b><br><span class="hint">${esc(t.email)}</span>`, go('schools', 'school_id', t.school_id, by('schools', t.school_id).name, by('schools', t.school_id).name || '?'), esc(t.role),
    go('classes', 'teacher_id', t.id, t.name + ' 선생님', D.classes.filter(c => c.teacher_id === t.id).length + '개'), stag(t.status),
    (t.status !== '승인' ? `<button class="btn sm pri" data-t="${esc(t.id)}" data-s="승인">승인</button> ` : '') + (t.status !== '거절' ? `<button class="btn sm" data-t="${esc(t.id)}" data-s="거절">${t.status === '승인' ? '승인 취소' : '거절'}</button>` : '')]],
  classes: [['반', '학교', '담당 교사', '반 코드', '학생'], c => [`<b>${esc(c.name)}</b><br><span class="hint">${c.year}년${c.headcount ? ' · 예상 ' + c.headcount + '명' : ''}</span>`, c.trainer_id ? '<span class="tag">트레이너 반</span>' : go('schools', 'school_id', c.school_id, by('schools', c.school_id).name, by('schools', c.school_id).name || '?'),
    c.trainer_id ? trLink(c.trainer_id) : go('teachers', 'teacher_id', c.teacher_id, by('teachers', c.teacher_id).name, by('teachers', c.teacher_id).name || '?'), `<span class="mono">${esc(c.code)}</span>`, go('students', 'class_id', c.id, c.name, D.students.filter(s => s.class_id === c.id).length + '명')]],
  students: [['닉네임', '학교 · 반', '대회', '훈련', '마지막 기록', '관리'], s => { const c = by('classes', s.class_id), sc = by('schools', c.school_id);
    return [`<b>${esc(s.nick)}</b><br><span class="hint">${s.age}세${s.guardian ? ' · 보호자 동의' : ''} · 가입 ${when(s.at)}</span>`, `${c.trainer_id ? trLink(c.trainer_id) : go('schools', 'school_id', sc.id, sc.name, sc.name || '?')}<br>${go('classes', 'class_id', c.id, c.name, c.name || '?')}`,
      s.contest + '회', s.train + '회', when(s.last), `<button class="btn sm pri" data-view="${esc(s.id)}">기록 보기</button> <button class="btn sm" data-ren="${esc(s.id)}">닉네임 수정</button>`]; }]
};
function render() {
  const waits = k => (k === 'teachers' || k === 'trainers' || k === 'centers') ? D[k].filter(t => t.status === '대기').length : 0;
  $('stats').innerHTML = Object.entries(KINDS).map(([k, v]) => `<button data-tab="${k}"><span>${v[0]}${waits(k) ? ' · 승인 대기 ' + waits(k) : ''}</span><b style="${waits(k) ? 'color:var(--warn)' : ''}">${D[k].length}</b></button>`).join('');
  $('tabs').innerHTML = Object.entries(KINDS).map(([k, v]) => `<button class="btn${k === tab ? ' on' : ''}" data-tab="${k}">${v[0]} 관리</button>`).join('');
  $('filter').hidden = $('clear').hidden = !only; if (only) $('filter').textContent = only.label + ' 만 보는 중';
  const q = $('q').value.trim().toLowerCase(), [head, row] = COLS[tab];
  const items = D[tab].filter(x => !only || ties(tab, x)[only.key] === only.id).filter(x => { if (!q) return true; const t = ties(tab, x), s = by('schools', t.school_id), c = t.class_id ? by('classes', t.class_id) : {}; const tr = t.trainer_id ? by('trainers', t.trainer_id) : {}; return [x.name, x.nick, x.email, x.code, x.phone, x.region, s.name, c.name, tr.name].some(v => v && String(v).toLowerCase().includes(q)); });
  $('list').innerHTML = items.length ? '<table><tr>' + head.map(h => `<th>${h}</th>`).join('') + '<th></th></tr>' + items.map(x => '<tr>' + row(x).map(v => `<td>${v}</td>`).join('') + `<td>${del(tab, x.id)}</td></tr>`).join('') + '</table>' : '<div class="empty">보여 줄 항목이 없어요.</div>';
}
async function load() { const r = await bsRpc('bs_admin_overview', { p_pass: pw }); if (!r.ok) return r; D = { ...r, centers: r.centers || [], trainers: r.trainers || [] }; if (only && !D[{ school_id: 'schools', teacher_id: 'teachers', trainer_id: 'trainers', center_id: 'centers', class_id: 'classes' }[only.key]].some(x => x.id === only.id)) only = null; if (shown && !D.students.some(s => s.id === shown)) { shown = null; $('detail').hidden = true; } render(); return r; }
async function act(fn, args, done) { say('msg', '처리 중…'); try { const r = await bsRpc(fn, { p_pass: pw, ...args }); if (!r.ok) { say('msg', r.msg, 'bad'); return; } await load(); say('msg', done, 'ok'); } catch { say('msg', NET, 'bad'); } }
async function view(id) { const s = by('students', id), box = $('detail'); shown = id; box.hidden = false; box.innerHTML = '<div class="empty">불러오는 중…</div>';
  try { const r = await bsRpc('bs_admin_student', { p_pass: pw, p_id: id }); if (!r.ok) throw 0; if (shown !== id) return;
    const table = (h, rows) => rows.length ? '<div class="scroll"><table><tr>' + h.map(x => `<th>${x}</th>`).join('') + '</tr>' + rows.map(v => '<tr>' + v.map(c => `<td>${c}</td>`).join('') + '</tr>').join('') + '</table></div>' : '<div class="empty">기록이 없어요.</div>';
    const cs = r.consent, how = { paper: '보호자 서면', self: '본인(14세 이상)', test: '절차 이전 시험 자료' };
    box.innerHTML = `<h2>${esc(s.nick)} 회원 기록</h2>${cs ? `<p class="hint">동의: ${esc(how[cs.method] || cs.method)} · ${when(cs.at)}${cs.by ? ' · 확인 ' + esc(cs.by) : ''} · 순위 공개 ${cs.rank ? '동의' : '미동의'}</p>` : ''}<h3 style="margin-top:14px">대회 기록</h3>` + table(['때', '종목', '점수'], r.contest.map(x => [when(x.at), esc(GN[x.game] || x.game), x.points + '점']))
      + '<h3 style="margin-top:18px">훈련 기록 (대회 도전 포함)</h3>' + table(['때', '종목', '점수', '평균 집중', '시간', '구분'], r.train.map(x => [when(x.at), esc(GN[x.game] || x.game), x.points + '점', x.avg_focus + '%', x.dur + '초', x.demo ? '데모' : '실기기']));
    box.scrollIntoView({ block: 'nearest' }); } catch { box.innerHTML = '<div class="empty">기록을 불러오지 못했어요.</div>'; } }
$('main').onclick = e => { const b = e.target.closest('button'); if (!b) return; const x = b.dataset;
  if (x.tab) { tab = x.tab; only = null; $('q').value = ''; return render(); }
  if (x.go) { tab = x.go; only = { key: x.key, id: x.id, label: x.label }; $('q').value = ''; return render(); }
  if (x.t) { b.disabled = true; return act('bs_admin_set_teacher', { p_id: x.t, p_status: x.s }, x.s === '승인' ? '승인했어요 ✔' : '거절 상태로 바꿨어요.'); }
  if (x.tr) { b.disabled = true; return act('bs_admin_set_trainer', { p_id: x.tr, p_status: x.s }, x.s === '승인' ? '트레이너를 승인했어요 ✔' : '거절 상태로 바꿨어요.'); }
  if (x.trpw) { b.parentElement.innerHTML = `<input class="search" style="min-width:160px" type="password" autocomplete="new-password" placeholder="새 비밀번호 8자 이상" aria-label="트레이너 새 비밀번호"> <button class="btn sm pri" data-trsave="${esc(x.trpw)}">저장</button> <button class="btn sm" data-cancel="1">취소</button>`; return; }
  if (x.trsave) { const v = b.parentElement.querySelector('input').value; if (v.length < 8) return say('msg', '새 비밀번호는 8자 이상으로 해 주세요.', 'bad'); return act('bs_admin_trainer_password', { p_id: x.trsave, p_new: v }, '트레이너 비밀번호를 새로 설정했어요.'); }
  if (x.ce) { b.disabled = true; return act('bs_admin_set_center', { p_id: x.ce, p_status: x.s }, x.s === '승인' ? '훈련장을 승인했어요 ✔' : '거절 상태로 바꿨어요.'); }
  if (x.cepw) { b.parentElement.innerHTML = `<input class="search" style="min-width:160px" type="password" autocomplete="new-password" placeholder="새 비밀번호 8자 이상" aria-label="훈련장 새 비밀번호"> <button class="btn sm pri" data-cesave="${esc(x.cepw)}">저장</button> <button class="btn sm" data-cancel="1">취소</button>`; return; }
  if (x.cesave) { const v = b.parentElement.querySelector('input').value; if (v.length < 8) return say('msg', '새 비밀번호는 8자 이상으로 해 주세요.', 'bad'); return act('bs_admin_center_password', { p_id: x.cesave, p_new: v }, '훈련장 비밀번호를 새로 설정했어요.'); }
  if (x.view) return view(x.view);
  if (x.ren) { const td = b.parentElement; td.innerHTML = `<input class="search" style="min-width:140px" maxlength="12" value="${esc(by('students', x.ren).nick)}" aria-label="새 닉네임"> <button class="btn sm pri" data-save="${esc(x.ren)}">저장</button> <button class="btn sm" data-cancel="1">취소</button>`; return; }
  if (x.save) return act('bs_admin_rename_student', { p_id: x.save, p_nick: b.parentElement.querySelector('input').value }, '닉네임을 바꿨어요.');
  if (x.cancel) return render();
  // 삭제는 되돌릴 수 없어서 두 번 눌러야 실행
  if (x.del) { if (!x.sure) { b.dataset.sure = 1; b.textContent = x.del === 'student' ? '정말 삭제? (기록 포함)' : '정말 삭제? (딸린 정보 포함)'; setTimeout(() => { delete b.dataset.sure; b.textContent = '삭제'; }, 5000); return; } b.disabled = true; return act('bs_admin_delete', { p_kind: x.del, p_id: x.id }, '삭제했어요.'); }
};
$('q').oninput = () => render();
$('list').onchange = e => { const s = e.target.closest('[data-assign]'); if (s) act('bs_admin_assign_trainer', { p_trainer: s.dataset.assign, p_center: s.value || null }, '소속 훈련장을 바꿨어요.'); };
$('clear').addEventListener('click', () => { only = null; render(); });
$('login').onsubmit = async e => { e.preventDefault(); pw = $('pw').value; if (!pw) return say('inMsg', '비밀번호를 입력해 주세요.', 'bad'); $('inBtn').disabled = true; say('inMsg', '확인 중…');
  try { const r = await load(); if (!r.ok) say('inMsg', r.msg, 'bad'); else { $('login').hidden = true; $('main').hidden = false; $('pw').value = ''; say('inMsg', ''); loadExtra(); } } catch { say('inMsg', NET, 'bad'); } $('inBtn').disabled = false; };
const pwClose = () => { $('pwForm').reset(); $('pwForm').hidden = true; say('pwMsg', ''); };
$('pwOpen').onclick = () => { $('pwForm').hidden = false; $('pwOld').focus(); };
$('pwCancel').onclick = pwClose;
$('pwForm').onsubmit = async e => { e.preventDefault(); const o = $('pwOld').value, n = $('pwNew').value;
  if (!o) return say('pwMsg', '지금 비밀번호를 입력해 주세요.', 'bad'); if (n.length < 8) return say('pwMsg', '새 비밀번호는 8자 이상으로 해 주세요.', 'bad'); if (n !== $('pwNew2').value) return say('pwMsg', '새 비밀번호 두 칸이 서로 달라요.', 'bad');
  $('pwSave').disabled = true; say('pwMsg', '변경 중…');
  try { const r = await bsRpc('bs_admin_change_password', { p_old: o, p_new: n }); if (!r.ok) say('pwMsg', r.msg, 'bad'); else { pw = n; pwClose(); say('msg', '비밀번호를 변경했어요 ✔', 'ok'); } } catch { say('pwMsg', NET, 'bad'); } $('pwSave').disabled = false; };
async function loadExtra() {
  try { const s = await bsRpc('bs_admin_settings', { p_pass: pw, p_allow_demo: null }); if (s.ok) $('demoOk').checked = s.allow_demo;
    const r = await bsRpc('bs_admin_inquiries', { p_pass: pw }); if (!r.ok) throw 0; const n = r.inquiries.filter(x => !x.done).length;
    $('iqTitle').textContent = `홈페이지 문의 · 처리 전 ${n}건`;
    $('inquiries').innerHTML = r.inquiries.length ? '<table><tr><th>때</th><th>학교·기관 / 성함</th><th>연락처</th><th>내용</th><th>처리</th></tr>' + r.inquiries.map(x => `<tr><td>${when(x.at)}</td><td><b>${esc(x.org)}</b><br><span class="hint">${esc(x.name)}</span></td><td>${esc(x.contact)}</td><td style="white-space:pre-wrap;min-width:240px">${esc(x.track)}${x.who ? ' · ' + esc(x.who) : ''}${x.msg ? '\n' + esc(x.msg) : ''}</td><td><button class="btn sm${x.done ? '' : ' pri'}" data-iq="${esc(x.id)}" data-a="${x.done ? 'open' : 'done'}">${x.done ? '다시 열기' : '처리 완료'}</button> <button class="btn sm" data-iq="${esc(x.id)}" data-a="delete">삭제</button></td></tr>`).join('') + '</table>' : '<div class="empty">들어온 문의가 없어요.</div>';
  } catch { $('inquiries').innerHTML = '<div class="empty">문의를 불러오지 못했어요. 8번 SQL 실행 여부를 확인해 주세요.</div>'; } }
$('inquiries').addEventListener('click', async e => { const b = e.target.closest('[data-iq]'); if (!b) return; e.stopPropagation(); if (b.dataset.a === 'delete' && !b.dataset.sure) { b.dataset.sure = 1; b.textContent = '정말 삭제?'; return; } b.disabled = true;
  try { const r = await bsRpc('bs_admin_inquiry', { p_pass: pw, p_id: b.dataset.iq, p_action: b.dataset.a }); if (!r.ok) say('msg', r.msg, 'bad'); await loadExtra(); } catch { say('msg', NET, 'bad'); b.disabled = false; } });
try { $('admTest').checked = localStorage.getItem('bs_admin_test') === '1'; } catch {}
$('admTest').onchange = () => { try { if ($('admTest').checked) localStorage.setItem('bs_admin_test', '1'); else localStorage.removeItem('bs_admin_test'); say('setMsg', $('admTest').checked ? '이 컴퓨터에서 테스트 조작을 켰어요.' : '테스트 조작을 껐어요.', 'ok'); } catch { $('admTest').checked = false; say('setMsg', '이 브라우저에는 저장할 수 없어요.', 'bad'); } };
$('demoOk').onchange = async () => { try { const r = await bsRpc('bs_admin_settings', { p_pass: pw, p_allow_demo: $('demoOk').checked }); if (!r.ok) throw 0; $('demoOk').checked = r.allow_demo; say('setMsg', r.allow_demo ? '데모 점수가 순위에 올라가요 (시험용).' : '실기기 점수만 순위에 올라가요.', 'ok'); } catch { $('demoOk').checked = !$('demoOk').checked; say('setMsg', NET, 'bad'); } };
$('re').onclick = () => { act('bs_admin_overview', {}, '새로 불러왔어요.'); loadExtra(); };
$('out').onclick = () => { pwClose(); pw = ''; D = null; only = shown = null; $('main').hidden = true; $('detail').hidden = true; $('login').hidden = false; $('list').innerHTML = $('detail').innerHTML = $('stats').innerHTML = $('inquiries').innerHTML = ''; say('setMsg', ''); };
const keepGet = k => { try { return JSON.parse(sessionStorage.getItem(k)); } catch { return null; } };
const keepSet = (k, v) => { try { if (v === null) sessionStorage.removeItem(k); else sessionStorage.setItem(k, JSON.stringify(v)); } catch {} };
// 새로고침해도 로그인과 보던 목록 유지 (이 창을 닫거나 '나가기'를 누르면 지워짐)
setInterval(() => { if (pw && !$('main').hidden) keepSet('bs_admin_keep', { pw, tab }); }, 500);
$('out').addEventListener('click', () => keepSet('bs_admin_keep', null));
{ const w = keepGet('bs_admin_keep'); if (w && w.pw) { pw = w.pw; if (w.tab in KINDS) tab = w.tab; load().then(r => { if (r.ok) { $('login').hidden = true; $('main').hidden = false; loadExtra(); } else { pw = ''; keepSet('bs_admin_keep', null); } }).catch(() => { pw = ''; }); } }
</script>
</body>
